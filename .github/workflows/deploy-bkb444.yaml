name: Deploy bkb444 API

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-bkb444-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.BKB444_VPS_HOST }}
          username: ${{ secrets.BKB444_VPS_USERNAME }}
          key: ${{ secrets.BKB444_VPS_KEY }}
          timeout: 120s
          command_timeout: 30m
          envs: GITHUB_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/snap/bin"
            DEPLOY_DIR="/root/bkb444-server"
            DOMAIN="api.bkb444.site"
            COMPOSE_FILE="docker-compose.bkb444.yml"
            REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

            if ! command -v git >/dev/null 2>&1; then
              echo "ERROR: git is not installed on the host."
              exit 1
            fi
            if ! command -v docker >/dev/null 2>&1; then
              echo "ERROR: Docker is not installed on the host."
              exit 1
            fi
            if ! command -v nginx >/dev/null 2>&1; then
              echo "ERROR: nginx is not installed on the host."
              exit 1
            fi

            if [ ! -d "${DEPLOY_DIR}/.git" ]; then
              echo "Cloning repository into ${DEPLOY_DIR}..."
              ENV_BACKUP=""
              if [ -f "${DEPLOY_DIR}/.env" ]; then
                ENV_BACKUP="$(mktemp)"
                cp "${DEPLOY_DIR}/.env" "${ENV_BACKUP}"
              fi
              rm -rf "${DEPLOY_DIR}"
              git clone --branch main "${REPO_URL}" "${DEPLOY_DIR}"
              if [ -n "${ENV_BACKUP}" ]; then
                mv "${ENV_BACKUP}" "${DEPLOY_DIR}/.env"
              fi
            fi

            cd "${DEPLOY_DIR}"
            git remote set-url origin "${REPO_URL}"
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo "ERROR: ${DEPLOY_DIR}/.env is missing. Copy .env.example and fill secrets on the server."
              exit 1
            fi

            if [ -d "/etc/letsencrypt/live/${DOMAIN}" ] && [ -f "deploy/nginx/${DOMAIN}.ssl.conf" ]; then
              sudo cp "deploy/nginx/${DOMAIN}.ssl.conf" "/etc/nginx/sites-available/${DOMAIN}"
            elif [ -f "deploy/nginx/${DOMAIN}.conf" ]; then
              sudo cp "deploy/nginx/${DOMAIN}.conf" "/etc/nginx/sites-available/${DOMAIN}"
            fi
            if [ -f "/etc/nginx/sites-available/${DOMAIN}" ]; then
              sudo ln -sf "/etc/nginx/sites-available/${DOMAIN}" "/etc/nginx/sites-enabled/${DOMAIN}"
            fi

            docker compose -f "${COMPOSE_FILE}" up -d --build

            sudo nginx -t
            sudo systemctl reload nginx

            if [ ! -d "/etc/letsencrypt/live/${DOMAIN}" ]; then
              echo "Requesting TLS certificate for ${DOMAIN}..."
              sudo certbot --nginx -d "${DOMAIN}" --non-interactive --agree-tos \
                --register-unsafely-without-email || echo "WARN: certbot failed — point DNS A record to this host first"
            else
              sudo certbot renew --quiet || true
            fi

            if [ -d "/etc/letsencrypt/live/${DOMAIN}" ] && [ -f "deploy/nginx/${DOMAIN}.ssl.conf" ]; then
              sudo cp "deploy/nginx/${DOMAIN}.ssl.conf" "/etc/nginx/sites-available/${DOMAIN}"
              sudo ln -sf "/etc/nginx/sites-available/${DOMAIN}" "/etc/nginx/sites-enabled/${DOMAIN}"
            fi

            sudo nginx -t
            sudo systemctl reload nginx

            echo "Deployed https://${DOMAIN}"
